<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Showcase — PixelCat Community Designs</title>
  <meta name="description" content="Browse and share custom PixelCat designs from the community.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600&family=Pixelify+Sans:wght@500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Manrope', sans-serif;
    }
    h1, h2, h3 {
      font-family: 'Pixelify Sans', sans-serif;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #d4c8ff;
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #8b9eff;
    }

    * {
      scrollbar-color: #d4c8ff transparent;
      scrollbar-width: thin;
    }
  </style>
</head>

<body class="min-h-screen overflow-x-hidden bg-[#f5f3ff] text-[#1a1a4d] antialiased">
  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute -left-24 top-28 h-80 w-80 rounded-full bg-[#d4c8ff]/40 blur-3xl"></div>
    <div class="absolute -right-20 top-[30rem] h-96 w-96 rounded-full bg-[#d896ff]/40 blur-3xl"></div>
    <div class="absolute bottom-0 left-1/3 h-72 w-72 rounded-full bg-[#8b9eff]/20 blur-3xl"></div>
  </div>

  <header class="relative z-50 px-4 pt-4 sm:px-6 lg:px-8">
    <nav class="mx-auto flex max-w-6xl items-center justify-between rounded-2xl border border-[#d4c8ff] bg-[#fffbff]/90 px-4 py-3 shadow-[0_8px_30px_rgba(26,26,77,0.08)] backdrop-blur sm:px-5">
      <a href="./index.html" class="flex items-center gap-3" aria-label="PixelCat home">
        <img src="./assets/PixelCatIco.png" alt="PixelCat" class="h-9 w-9" />
        <span class="text-sm font-semibold tracking-[-0.04em]" style="font-family: 'Pixelify Sans', sans-serif; background: linear-gradient(90deg, #8b9eff 0%, #d4c8ff 50%, #9ca3af 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">PIXELCAT</span>
      </a>

      <div class="hidden items-center gap-2 md:flex">
        <a href="./index.html" class="inline-flex items-center gap-2 rounded-xl border border-[#d4c8ff] bg-[#fffbff] px-4 py-2 text-sm font-semibold transition hover:bg-white">
          Back
        </a>
      </div>

      <button id="menuButton" class="grid h-10 w-10 place-items-center rounded-xl border border-[#d4c8ff] bg-white md:hidden" aria-label="Open menu" aria-expanded="false">
        <iconify-icon id="menuIcon" icon="solar:hamburger-menu-linear" class="text-xl" stroke-width="1.5"></iconify-icon>
      </button>
    </nav>
  </header>

  <main>
    <section class="px-4 pb-20 pt-16 sm:px-6 sm:pt-24 lg:px-8">
      <div class="mx-auto max-w-6xl">
        <div class="text-center mb-12">
          <h1 class="text-[3.5rem] font-semibold leading-tight tracking-[-0.065em] sm:text-6xl lg:text-7xl">
            Community Showcase
          </h1>
          <p class="mx-auto mt-8 max-w-2xl text-base leading-7 text-[#6b5ba0] sm:text-lg sm:leading-8">
            Browse amazing cat designs from the community. Share your own creations and inspire others.
          </p>
        </div>

        <!-- Add Design Button -->
        <div class="mb-12 text-center">
          <button onclick="openAddDesignModal()" class="inline-flex items-center gap-2 rounded-xl border border-[#1a1a4d] bg-[#1a1a4d] px-6 py-4 text-sm font-semibold text-white shadow-[4px_5px_0_#d4c8ff] transition hover:-translate-y-1 hover:shadow-[5px_7px_0_#d4c8ff]">
            <iconify-icon icon="solar:add-circle-linear" class="text-lg" stroke-width="1.5"></iconify-icon>
            Add Your Design
          </button>
        </div>

        <!-- Designs Grid -->
        <div id="designsGrid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
          <!-- Designs will be loaded here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-12">
          <p class="text-[#6b5ba0]">No designs yet. Be the first to share!</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Add Design Modal -->
  <div id="addDesignModal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center bg-black/50 backdrop-blur-sm overflow-y-auto">
    <div class="w-full max-w-lg rounded-2xl border-2 border-[#1a1a4d] bg-[#fffbff] p-8 shadow-[0_20px_60px_rgba(26,26,77,0.3)] my-8">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-semibold text-[#1a1a4d]">Add Your Design</h2>
        <button onclick="closeAddDesignModal()" class="text-[#6b5ba0] hover:text-[#1a1a4d]">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <form id="designForm" onsubmit="handleAddDesign(event)" class="space-y-4">
        <!-- Design Name -->
        <div>
          <label class="block text-sm font-semibold text-[#1a1a4d] mb-2">Design Name</label>
          <input type="text" id="designName" placeholder="e.g., Midnight Black Cat" required class="w-full rounded-lg border border-[#d4c8ff] bg-[#f5f3ff] px-4 py-3 text-sm placeholder-[#9ca3af] focus:outline-none focus:border-[#8b9eff] focus:ring-2 focus:ring-[#8b9eff]/20" />
        </div>

        <!-- Description -->
        <div>
          <label class="block text-sm font-semibold text-[#1a1a4d] mb-2">Description</label>
          <textarea id="designDescription" placeholder="Describe your cat design..." rows="3" required class="w-full rounded-lg border border-[#d4c8ff] bg-[#f5f3ff] px-4 py-3 text-sm placeholder-[#9ca3af] focus:outline-none focus:border-[#8b9eff] focus:ring-2 focus:ring-[#8b9eff]/20 resize-none"></textarea>
        </div>

        <!-- Design Image -->
        <div>
          <label class="block text-sm font-semibold text-[#1a1a4d] mb-2">Design Image</label>
          <div id="imageDropZone" class="relative w-full h-40 rounded-xl border-2 border-dashed border-[#d4c8ff] bg-[#f5f3ff] transition flex items-center justify-center cursor-pointer hover:border-[#8b9eff] hover:bg-[#f0e8ff]">
            <input type="file" id="designImage" accept="image/*" required class="hidden" />
            <div class="text-center pointer-events-none">
              <svg class="w-8 h-8 mx-auto mb-2 text-[#8b9eff]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
              </svg>
              <p class="text-sm font-semibold text-[#1a1a4d]">Drag your image here</p>
              <p class="text-xs text-[#9ca3af]">or click to select</p>
            </div>
            <img id="imagePreview" src="" alt="Preview" class="hidden absolute inset-0 w-full h-full object-cover rounded-lg" />
          </div>
        </div>

        <!-- JSON File -->
        <div>
          <label class="block text-sm font-semibold text-[#1a1a4d] mb-2">Design JSON File</label>
          <div id="jsonDropZone" class="relative w-full h-32 rounded-xl border-2 border-dashed border-[#d4c8ff] bg-[#f5f3ff] transition flex items-center justify-center cursor-pointer hover:border-[#8b9eff] hover:bg-[#f0e8ff]">
            <input type="file" id="designJSON" accept=".json" required class="hidden" />
            <div class="text-center pointer-events-none">
              <svg class="w-8 h-8 mx-auto mb-2 text-[#8b9eff]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
              </svg>
              <p class="text-sm font-semibold text-[#1a1a4d]">Drag JSON file here</p>
              <p class="text-xs text-[#9ca3af]">or click to select</p>
            </div>
            <span id="jsonFileName" class="hidden absolute text-sm text-[#1a1a4d] font-semibold"></span>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="w-full rounded-xl bg-[#1a1a4d] px-4 py-3 text-sm font-semibold text-white shadow-[4px_4px_0_#d4c8ff] transition hover:-translate-y-0.5 hover:shadow-[5px_5px_0_#d4c8ff]">
          Submit Design
        </button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="border-t border-[#d4c8ff] bg-[#f5f3ff] px-4 py-8 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-6xl">
      <div class="flex flex-col items-center justify-between gap-6 sm:flex-row">
        <p class="text-sm text-[#6b5ba0]">©2026 PixelCat</p>
        <div class="flex gap-6">
          <a href="#terms" class="text-sm text-[#6b5ba0] transition hover:text-[#1a1a4d]">TERMS</a>
          <a href="#privacy" class="text-sm text-[#6b5ba0] transition hover:text-[#1a1a4d]">PRIVACY</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    // Initialize Supabase
    const SUPABASE_URL = 'https://aruivlzkiqknqldefegp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_U9rHF4DDovZLn0RY3azpwg_W56itNco';
    
    let supabaseClient;
    let designs = [];

    // Initialize Supabase when page loads
    window.addEventListener('load', async () => {
      // Create Supabase client
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      
      console.log('Supabase client initialized');
      
      await loadDesigns();
    });

    // Setup drag and drop for image
    const imageDropZone = document.getElementById('imageDropZone');
    const designImage = document.getElementById('designImage');
    const imagePreview = document.getElementById('imagePreview');

    imageDropZone.addEventListener('click', () => designImage.click());
    imageDropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      imageDropZone.classList.add('border-[#8b9eff]', 'bg-[#f0e8ff]');
      imageDropZone.querySelector('div').style.display = 'none';
    });
    imageDropZone.addEventListener('dragleave', () => {
      imageDropZone.classList.remove('border-[#8b9eff]', 'bg-[#f0e8ff]');
      imageDropZone.querySelector('div').style.display = 'block';
    });
    imageDropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      imageDropZone.classList.remove('border-[#8b9eff]', 'bg-[#f0e8ff]');
      imageDropZone.querySelector('div').style.display = 'block';
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        designImage.files = files;
        loadImagePreview();
      }
    });

    designImage.addEventListener('change', loadImagePreview);

    function loadImagePreview() {
      const file = designImage.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          imagePreview.src = e.target.result;
          imagePreview.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    // Setup drag and drop for JSON
    const jsonDropZone = document.getElementById('jsonDropZone');
    const designJSON = document.getElementById('designJSON');
    const jsonFileName = document.getElementById('jsonFileName');

    jsonDropZone.addEventListener('click', () => designJSON.click());
    jsonDropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      jsonDropZone.classList.add('border-[#8b9eff]', 'bg-[#f0e8ff]');
      jsonDropZone.querySelector('div').style.display = 'none';
    });
    jsonDropZone.addEventListener('dragleave', () => {
      jsonDropZone.classList.remove('border-[#8b9eff]', 'bg-[#f0e8ff]');
      jsonDropZone.querySelector('div').style.display = 'block';
    });
    jsonDropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      jsonDropZone.classList.remove('border-[#8b9eff]', 'bg-[#f0e8ff]');
      jsonDropZone.querySelector('div').style.display = 'block';
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        designJSON.files = files;
        updateJsonFileName();
      }
    });

    designJSON.addEventListener('change', updateJsonFileName);

    function updateJsonFileName() {
      const file = designJSON.files[0];
      if (file) {
        jsonFileName.textContent = file.name;
        jsonFileName.classList.remove('hidden');
      }
    }

    function openAddDesignModal() {
      document.getElementById('addDesignModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeAddDesignModal() {
      document.getElementById('addDesignModal').classList.add('hidden');
      document.body.style.overflow = 'auto';
      document.getElementById('designForm').reset();
      imagePreview.classList.add('hidden');
      jsonFileName.classList.add('hidden');
    }

    async function handleAddDesign(e) {
      e.preventDefault();

      const name = document.getElementById('designName').value;
      const description = document.getElementById('designDescription').value;
      const imageFile = designImage.files[0];
      const jsonFile = designJSON.files[0];

      if (!name || !description || !imageFile || !jsonFile) {
        alert('Please fill in all fields');
        return;
      }

      // Ask for username
      let creatorName = prompt('Enter your username:');
      if (!creatorName || creatorName.trim() === '') {
        alert('Please enter a username');
        return;
      }
      creatorName = creatorName.trim();

      try {
        // Read image as base64
        const imageBase64 = await fileToBase64(imageFile);
        
        // Read JSON file
        const jsonContent = await fileToText(jsonFile);
        const jsonData = JSON.parse(jsonContent);

        // Create design object
        const designData = {
          name,
          description,
          image: imageBase64,
          json_data: jsonData,
          json_filename: jsonFile.name,
          creator_name: creatorName,
          created_at: new Date().toISOString()
        };

        console.log('Submitting design:', designData);

        // Insert into Supabase
        const { data, error } = await supabaseClient
          .from('community_designs')
          .insert([designData])
          .select();

        if (error) {
          console.error('Error adding design:', error);
          alert(`Error adding design: ${error.message || 'Please try again.'}`);
          return;
        }

        console.log('Design added successfully:', data);

        // Reset form and close modal
        closeAddDesignModal();
        await loadDesigns();

        alert('Design added successfully!');
      } catch (error) {
        console.error('Error adding design:', error);
        alert(`Error adding design: ${error.message || 'Please check your JSON file.'}`);
      }
    }

    async function loadDesigns() {
      try {
        const { data, error } = await supabaseClient
          .from('community_designs')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) {
          console.error('Error loading designs:', error);
          return;
        }

        designs = data || [];
        renderDesigns();
      } catch (error) {
        console.error('Error loading designs:', error);
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function fileToText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsText(file);
      });
    }

    function renderDesigns() {
      const grid = document.getElementById('designsGrid');
      const emptyState = document.getElementById('emptyState');

      if (designs.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      grid.innerHTML = designs.map(design => `
        <div class="rounded-2xl border border-[#d4c8ff] bg-[#fffbff] overflow-hidden hover:shadow-lg transition">
          <div class="w-full h-48 bg-[#f5f3ff] overflow-hidden flex items-center justify-center">
            <img src="${design.image}" alt="${design.name}" class="w-full h-full object-contain" />
          </div>
          <div class="p-6">
            <h3 class="text-lg font-semibold text-[#1a1a4d] mb-1">${design.name}</h3>
            <p class="text-xs text-[#9ca3af] mb-3">by ${design.creator_name}</p>
            <p class="text-sm text-[#6b5ba0] mb-4">${design.description}</p>
            <button onclick="downloadDesign(${design.id}, '${design.json_filename}')" class="w-full rounded-lg bg-[#8b9eff] px-4 py-2 text-sm font-semibold text-white transition hover:bg-[#7a8ce0]">
              Download JSON
            </button>
          </div>
        </div>
      `).join('');
    }

    function downloadDesign(id, filename) {
      const design = designs.find(d => d.id === id);
      if (!design) return;

      // Create and download JSON
      const element = document.createElement('a');
      element.setAttribute('href', 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(design.json_data, null, 2)));
      element.setAttribute('download', filename || `design-${id}.json`);
      element.style.display = 'none';
      document.body.appendChild(element);
      element.click();
      document.body.removeChild(element);
    }
  </script>
</body>
</html>
